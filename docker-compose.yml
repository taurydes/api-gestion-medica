version: "3.8"

services:
  # ===============================
  # 🚀 SERVICIO PRINCIPAL (NestJS)
  # ===============================
  api-ads-suve:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: api-ads-suve
      restart: always
      env_file: .env
      volumes:
        - ${UPLOADS_PATH}:/app/uploads
        - /etc/localtime:/etc/localtime:ro
        - /etc/timezone:/etc/timezone:ro
      environment:
        TZ: America/Caracas
      ports:
        - "${PORT}:${PORT}"
      networks:
        - base-net
      depends_on:
        - redis-api-ads-suve
      healthcheck:
        test: ["CMD", "node", "-e", "require('net').createConnection(process.env.PORT).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
        interval: 30s
        timeout: 5s
        retries: 5

  # ===============================
  # 🧠 REDIS
  # ===============================
  redis-api-ads-suve:
    image: redis:7
    container_name: redis-api-ads-suve
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - base-net
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  # ===============================
