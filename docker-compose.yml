  #     POSTGRES_DB: ${DB_NAME}
  #     TZ: America/Caracas
  #   ports:
  #     - "${DB_PORT:-5432}:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - base-net
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
  #     interval: 10s
  #     timeout: 10s
  #     retries: 5

  # ===============================
  # 📬 MAILPIT
  # ===============================
  # mailpit:
  #   ... (se mantiene comentado)

networks:
  base-net:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
